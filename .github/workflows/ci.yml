name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test - secure example must pass
        run: mcp-guard scan examples/secure
      - name: Smoke test - vulnerable example must fail
        shell: bash
        run: |
          set +e
          mcp-guard scan examples/vulnerable -f sarif -o results.sarif
          code=$?
          test "$code" -eq 1 || { echo "expected exit 1, got $code"; exit 1; }
          python -c "import json; d=json.load(open('results.sarif')); assert d['runs'][0]['results']"
