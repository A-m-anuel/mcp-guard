[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-guard"
version = "1.0.0"
description = "Security scanner for MCP (Model Context Protocol) server configs and AI agent tool definitions"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Amanuel Abate Seid" }]
keywords = ["mcp", "model-context-protocol", "ai-security", "llm", "prompt-injection", "sast", "sarif", "devsecops"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/A-m-anuel/mcp-guard"
Issues = "https://github.com/A-m-anuel/mcp-guard/issues"

[project.scripts]
mcp-guard = "mcp_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
